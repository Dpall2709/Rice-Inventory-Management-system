<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Rice Billing{% endblock %}</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
  body{min-height:100vh;display:flex;justify-content:center;align-items:center;
       background:linear-gradient(135deg,#0f172a,#1e293b);padding:16px}
  .wrap{width:100%;max-width:420px}
  .card{background:#fff;border-radius:20px;padding:36px;box-shadow:0 15px 40px rgba(0,0,0,.15)}
  h1{font-size:20px;margin-bottom:8px;color:#0f172a}
  p{font-size:14px;color:#475569;margin-bottom:18px;line-height:1.5}
  label{display:block;font-size:13px;color:#334155;margin:14px 0 6px}
  input{width:100%;padding:12px 14px;border:1px solid #cbd5e1;border-radius:10px;font-size:14px}
  button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:10px;background:#16a34a;
         color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  button:hover{background:#15803d}
  a{color:#16a34a;text-decoration:none;font-size:14px}
  .foot{text-align:center;margin-top:18px}
  .err{background:#fef2f2;color:#b91c1c;padding:10px 12px;border-radius:8px;font-size:13px;margin-top:12px}
  .ok{background:#f0fdf4;color:#15803d;padding:10px 12px;border-radius:8px;font-size:13px;margin-top:12px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div style="text-align:center;font-size:26px;margin-bottom:10px">🌾</div>
      {% block content %}{% endblock %}
    </div>
  </div>
</body>
</html>
