{% load i18n %}{% get_current_language as LANGUAGE_CODE %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ sale.invoice_no }}</title>
<style>
  /* The printed copy IS the invoice PDF - same layout as the download. */
  html, body { margin: 0; height: 100%; background: #525659; font: 14px/1.4 "Inter", "Noto Sans Devanagari", Arial, sans-serif; }
  .bar { display: flex; gap: 8px; align-items: center; padding: 10px 14px; background: #1f2937; color: #fff; flex-wrap: wrap; }
  .bar strong { margin-right: auto; }
  .bar a, .bar button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #4b5563; background: #374151; color: #fff; text-decoration: none; cursor: pointer; }
  .bar button { background: #16a34a; border-color: #16a34a; font-weight: 600; }
  iframe { display: block; width: 100%; height: calc(100% - 58px); border: 0; background: #fff; }
  .note { color: #d1d5db; font-size: 12px; width: 100%; }
</style>
</head>
<body>
  <div class="bar">
    <strong>🧾 {{ sale.invoice_no }}</strong>
    <a href="{% url 'sale_detail' sale.id %}">← {% translate "Back" %}</a>
    <a href="{{ pdf_url }}?download=1">⬇️ {% translate "Download PDF" %}</a>
    {% if statement_url %}<a href="{{ statement_url }}" target="_blank" rel="noopener">🧾 {% translate "Settlement statement" %}</a>{% endif %}
    <button type="button" id="printBtn">🖨 {% translate "Print" %}</button>
  </div>
  <iframe id="invoice" src="{{ pdf_url }}" title="{{ sale.invoice_no }}"></iframe>

  <script>
    // Print the PDF itself. Some phone browsers cannot print an embedded PDF;
    // there the PDF opens on its own and is printed from its viewer.
    (function () {
      var frame = document.getElementById("invoice");
      var printed = false;
      function printPdf() {
        try {
          frame.contentWindow.focus();
          frame.contentWindow.print();
          printed = true;
        } catch (e) {
          window.location.href = "{{ pdf_url|escapejs }}";
        }
      }
      document.getElementById("printBtn").addEventListener("click", printPdf);
      frame.addEventListener("load", function () {
        if (!printed) setTimeout(printPdf, 400);
      });
    })();
  </script>
</body>
</html>
